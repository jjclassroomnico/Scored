<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Partidos — ScoreEd</title>    <link rel="stylesheet" href="/scoreEd/assets/css/admin.css"></head><body><aside class="sidebar">    <a class="sidebar-logo" href="dashboard.html"><span class="sidebar-logo-icon">🏆</span><span class="sidebar-logo-text">Score<span>Ed</span></span></a>    <div class="sidebar-section">Administración</div>    <nav class="sidebar-nav">        <a href="dashboard.html"><span class="nav-icon">⊞</span> Panel</a>        <a href="equipos.html"><span class="nav-icon">🛡️</span> Equipos</a>        <a href="jugadores.html"><span class="nav-icon">👤</span> Jugadores</a>        <a href="arbitros.html"><span class="nav-icon">👥</span> Árbitros</a>        <a href="partidos.html" class="active"><span class="nav-icon">📅</span> Partidos</a>        <a href="torneos.html"><span class="nav-icon">📈</span> Torneos</a>    </nav>    <div class="sidebar-footer">        <div class="sidebar-user"><div class="sidebar-avatar">👤</div><div class="sidebar-user-info"><div class="sidebar-user-name">Administrador</div><div class="sidebar-user-role">admin</div></div></div>        <button class="btn-logout" id="btn-logout">↩ Cerrar Sesión</button>    </div></aside><div class="deporte-selector">    <div class="deporte-selector-inner">        <label for="sel-deporte-global">Deporte:</label>        <select id="sel-deporte-global"></select>    </div></div><main class="main-content">    <div class="page-header">        <div class="page-title"><h1>Gestión de Partidos</h1><p id="subtitulo">Cargando...</p></div>        <div style="display:flex;gap:.75rem">            <button class="btn-primary" id="btn-nuevo">+ Nuevo Partido</button>            <button class="btn-secondary" id="btn-fixture">🎲 Generar partidos al azar</button>        </div>    </div>    <!-- Modal fixture -->    <div id="modal-fixture" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;overflow-y:auto">        <div style="background:#fff;max-width:640px;margin:2rem auto;border-radius:12px;padding:2rem">            <h2 style="margin:0 0 1.25rem">Generar partidos al azar</h2>            <!-- Paso 1: torneo + equipos -->            <div id="fixture-paso1">                <div class="form-group">                    <label for="fix-torneo">Torneo</label>                    <select id="fix-torneo" class="form-control"></select>                </div>                <div class="form-group" style="margin-top:1rem">                    <label>Seleccioná los equipos que participan (debe ser potencia de 2: 2, 4, 8, 16...)</label>                    <div id="fix-equipos" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem"></div>                    <div id="fix-aviso" style="color:#ef4444;font-size:.82rem;margin-top:.5rem"></div>                </div>                <div style="display:flex;gap:.75rem;margin-top:1.5rem">                    <button class="btn-primary" id="fix-btn-sortear">🎲 Sortear</button>                    <button class="btn-secondary" id="fix-btn-cerrar">Cancelar</button>                </div>            </div>            <!-- Paso 2: completar árbitro y fecha -->            <div id="fixture-paso2" style="display:none">                <p style="color:#64748b;margin:0 0 1rem">Completá árbitro y fecha para cada partido:</p>                <div id="fix-partidos"></div>                <div style="display:flex;gap:.75rem;margin-top:1.5rem">                    <button class="btn-primary" id="fix-btn-crear">✓ Crear partidos</button>                    <button class="btn-secondary" id="fix-btn-volver">← Volver</button>                </div>                <div class="msg" id="fix-msg"></div>            </div>        </div>    </div>    <div class="card" id="form-card" style="display:none">        <div class="card-body">            <form id="form-partido">                <input type="hidden" id="id_partido">                <div class="form-grid">                    <div class="form-group"><label for="id_torneo">Torneo <span>*</span></label><select id="id_torneo" class="form-control"></select></div>                    <div class="form-group"><label for="fecha">Fecha <span>*</span></label><input type="date" id="fecha" class="form-control" required></div>                    <div class="form-group"><label for="id_equipo_local">Equipo Local <span>*</span></label><select id="id_equipo_local" class="form-control"></select></div>                    <div class="form-group"><label for="id_equipo_visitante">Equipo Visitante <span>*</span></label><select id="id_equipo_visitante" class="form-control"></select></div>                    <div class="form-group"><label for="id_arbitro">Árbitro <span>*</span></label><select id="id_arbitro" class="form-control"></select></div>                </div>                <div class="form-actions">                    <button type="submit" class="btn-primary">✓ Guardar</button>                    <button type="button" class="btn-secondary" id="btn-cancelar">✕ Cancelar</button>                </div>            </form>            <div class="msg" id="msg"></div>        </div>    </div>    <div class="table-wrap">        <table class="data-table">            <thead><tr>                <th>Local</th><th class="center">Resultado</th><th>Visitante</th>                <th>Torneo</th><th>Fecha</th><th>Árbitro</th><th>Estado</th>                <th class="center">Acciones</th>            </tr></thead>            <tbody id="tbody"></tbody>        </table>    </div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/scoreEd/assets/js/supabase.js"></script><script src="/scoreEd/assets/js/supabase-data.js"></script><script src="/scoreEd/assets/js/deporte-selector.js?v=12"></script><script src="/scoreEd/assets/js/partidos.js?v=12"></script><script src="/scoreEd/assets/js/sidebar-responsive.js?v=12"></script></body></html>
