<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>ScoreEd — Administrador</title>    <link rel="stylesheet" href="/scoreEd/assets/css/login.css">    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')}</script>    <script src="/scoreEd/assets/js/supabase.js?v=14"></script></head><body><a class="logo" href="/scoreEd/">    <span class="logo-icon">🏆</span>    <div class="logo-text">        <span class="logo-name">Score<span>Ed</span></span>        <span class="logo-sub">Sistema de Torneo Escolar</span>    </div></a><div class="card">    <div class="card-body">        <div class="card-title">Iniciar Sesión</div>        <div class="card-sub">Panel de Administración</div>        <div class="rol-indicator admin">🛡️ Administrador</div>        <form id="form-login">            <div class="form-group">                <label for="email">Email</label>                <input type="email" id="email" name="email" class="form-control admin" placeholder="admin@mail.com" autocomplete="off" required>            </div>            <div class="form-group">                <label for="password">Contraseña</label>                <input type="password" id="password" name="password" class="form-control admin" placeholder="••••••••" autocomplete="off" required>            </div>            <button type="submit" class="btn-submit admin">Iniciar Sesión</button>            <div class="msg-error" id="msg-error"></div>        </form>        <div class="link-otro">¿Sos árbitro? <a href="/scoreEd/views/arbitro/login.html" class="arbitro">Ingresá acá</a></div>    </div>    <div class="card-footer">ScoreEd v1.0 — Sistema de Gestión de Torneo Escolar</div></div><script>(function(){var e=document.getElementById('msg-error');function err(t){var txt=typeof t==='string'?t:(t&&t.message?t.message:JSON.stringify(t));e.textContent=txt;console.error('LOGIN:',txt)}sbCheckLoginPage('admin');document.getElementById('form-login').addEventListener('submit',function(t){t.preventDefault();e.textContent='';var u=document.getElementById('email').value.trim();var p=document.getElementById('password').value;var btn=t.target.querySelector('button');btn.disabled=true;btn.textContent='Ingresando...';console.log('LOGIN:enviando',u);sbLogin(u,p,'admin').then(function(){window.location.href='/scoreEd/views/admin/dashboard.html'}).catch(function(r){btn.disabled=false;btn.textContent='Iniciar Sesión';err(r)})})})();</script></body></html>
