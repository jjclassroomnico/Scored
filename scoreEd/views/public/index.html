<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>ScoreEd</title>    <link rel="stylesheet" href="/scoreEd/assets/css/public.css?v=13"></head><body><header>    <div class="header-inner">        <a class="logo" href="#">            <span class="logo-icon">⚽</span>            <span class="logo-text">Score<span>Ed</span></span>        </a>        <nav>            <a href="#" class="active" data-seccion="posiciones"><span>Posiciones</span></a>            <a href="#" data-seccion="resultados"><span>Resultados</span></a>            <a href="#" data-seccion="proximos"><span>Próximos</span></a>        </nav>    </div></header><div class="deporte-strip">    <div class="deporte-strip-inner" id="deporte-strip">        <div class="spinner" style="margin:.5rem auto"></div>    </div></div><div class="layout">    <!-- Sidebar izquierdo con selector de torneo -->    <aside class="sidebar-torneo">        <div class="sidebar-torneo-header">            <span class="sidebar-torneo-label">Torneos</span>        </div>        <div id="lista-torneos" class="lista-torneos">            <div class="spinner"></div>        </div>    </aside>    <!-- Contenido principal -->    <div class="content-area">        <!-- POSICIONES -->        <section id="sec-posiciones" class="seccion activa">            <div class="seccion-layout">                <div class="seccion-main">                    <div class="seccion-header"><h2>Tabla de Posiciones</h2></div>                    <div id="lider-card"></div>                    <div class="tabla-wrap" id="tabla-posiciones-wrap">                        <div class="spinner"></div>                    </div>                </div>                <div class="seccion-aside">                    <div class="stats-panel" id="stats-posiciones">                        <div class="spinner"></div>                    </div>                </div>            </div>        </section>        <!-- RESULTADOS -->        <section id="sec-resultados" class="seccion">            <div class="seccion-layout">                <div class="seccion-main">                    <div class="seccion-header"><h2>Resultados</h2></div>                    <div class="partidos-lista" id="lista-resultados">                        <div class="spinner"></div>                    </div>                </div>                <div class="seccion-aside">                    <div class="stats-panel" id="stats-resultados">                        <div class="spinner"></div>                    </div>                </div>            </div>        </section>        <!-- PRÓXIMOS -->        <section id="sec-proximos" class="seccion">            <div class="seccion-layout">                <div class="seccion-main">                    <div class="seccion-header"><h2>Próximos Partidos</h2></div>                    <div class="partidos-lista" id="lista-proximos">                        <div class="spinner"></div>                    </div>                </div>                <div class="seccion-aside">                    <div class="stats-panel" id="stats-proximos">                        <div class="spinner"></div>                    </div>                </div>            </div>        </section>    </div></div><!-- Modal detalle partido --><div id="modal-overlay" class="modal-overlay" style="display:none">    <div class="modal">        <button class="modal-close" id="modal-close">✕</button>        <div id="modal-contenido"></div>    </div></div><footer>    ScoreEd 2026 — Gestión de Torneos Escolares</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/scoreEd/assets/js/supabase.js?v=12"></script><script src="/scoreEd/assets/js/supabase-data.js?v=12"></script><script>let torneoActual = null;let deporteActual = null;document.querySelectorAll('nav a').forEach(a => {    a.addEventListener('click', e => {        e.preventDefault();        const sec = a.dataset.seccion;        document.querySelectorAll('nav a').forEach(x => x.classList.remove('active'));        document.querySelectorAll('.seccion').forEach(x => x.classList.remove('activa'));        a.classList.add('active');        document.getElementById('sec-' + sec).classList.add('activa');        cargarSeccion(sec);    });});const DEPORTES_CONF = {    1: { emoji: '⚽', color: '#16a34a' },    2: { emoji: '🏀', color: '#ea580c' },    3: { emoji: '🏐', color: '#2563eb' },    4: { emoji: '🤾', color: '#dc2626' },    5: { emoji: '⚡', color: '#9333ea' },};async function cargarDeportes() {    const data = await sbData.getDeportes();    const strip = document.getElementById('deporte-strip');    strip.innerHTML = data.map((d, i) => {        const conf = DEPORTES_CONF[d.id_deporte] || { emoji: '🏅', color: '#e8621a' };        const activo = i === 0 ? ' activo' : '';        const delay = i * 0.06;        return `<button class="deporte-pill${activo}" data-id="${d.id_deporte}" data-nombre="${d.nombre}"                style="--pill-color:${conf.color};animation-delay:${delay}s">            <span class="deporte-pill-icono">${conf.emoji}</span>            <span class="deporte-pill-nombre">${d.nombre}</span>        </button>`;    }).join('');    const primerBoton = strip.querySelector('.deporte-pill');    if (primerBoton) {        deporteActual = primerBoton.dataset.id;        cargarTorneos(deporteActual);    }    strip.querySelectorAll('.deporte-pill').forEach(btn => {        btn.addEventListener('click', () => {            if (btn.dataset.id === deporteActual) return;            strip.querySelectorAll('.deporte-pill').forEach(b => b.classList.remove('activo'));            btn.classList.add('activo');            deporteActual = btn.dataset.id;            document.getElementById('lider-card').innerHTML = '';            document.getElementById('lista-torneos').innerHTML = '<div class="spinner"></div>';            document.querySelectorAll('.seccion').forEach(x => x.classList.remove('activa'));            detenerRefresh();            cargarTorneos(deporteActual);        });    });}async function cargarTorneos(idDeporte) {    const data = await sbData.getTorneos(idDeporte);    const lista = document.getElementById('lista-torneos');    if (!data.length) {        lista.innerHTML = '<p class="sidebar-empty">Sin torneos de este deporte</p>';        document.querySelectorAll('.seccion').forEach(x => x.classList.remove('activa'));        document.querySelectorAll('.seccion .spinner').forEach(s => s.innerHTML = '<div class="empty"><div class="empty-icon">🏁</div>Sin torneos de este deporte</div>');        torneoActual = null;        return;    }    lista.innerHTML = data.map((t, i) => `        <button class="torneo-btn ${i === 0 ? 'activo' : ''}" data-id="${t.id_torneo}">            <span class="torneo-btn-nombre">${t.nombre}</span>            <span class="torneo-btn-anio">${t.anio}</span>        </button>`).join('');    torneoActual = data[0].id_torneo;    document.querySelectorAll('.seccion').forEach(x => x.classList.remove('activa'));    document.getElementById('sec-posiciones').classList.add('activa');    cargarSeccion('posiciones');    iniciarTiempoReal();    document.querySelectorAll('.torneo-btn').forEach(btn => {        btn.addEventListener('click', () => {            document.querySelectorAll('.torneo-btn').forEach(b => b.classList.remove('activo'));            btn.classList.add('activo');            torneoActual = btn.dataset.id;            document.getElementById('lider-card').innerHTML = '';            const activa = document.querySelector('.seccion.activa');            if (activa) cargarSeccion(activa.id.replace('sec-', ''));            detenerRefresh();            iniciarTiempoReal();        });    });}function cargarSeccion(sec) {    if (!torneoActual) return;    if (sec === 'posiciones') { cargarPosiciones(); cargarStats('stats-posiciones'); }    if (sec === 'resultados') { cargarResultados(); cargarStats('stats-resultados'); }    if (sec === 'proximos')   { cargarProximos();   cargarStats('stats-proximos'); }}async function cargarStats(panelId) {    const panel = document.getElementById(panelId);    panel.innerHTML = '<div class="spinner"></div>';    try {        const data = await sbData.getEstadisticas(parseInt(torneoActual));        if (!data || (!data.goleadores?.length && !data.tarjetas_amarillas?.length && !data.tarjetas_rojas?.length)) {            panel.innerHTML = '<p class="sidebar-empty">Sin estadísticas aún</p>';            return;        }        const renderLista = (titulo, icono, items, valKey, subKey) => {            const filas = items.length                ? items.slice(0, 5).map((x, i) => `                    <div class="stats-row">                        <span class="stats-rank">${i + 1}</span>                        <span class="stats-name">                            ${x.jugador ?? x.equipo}                            ${subKey && x[subKey] ? `<br><span class="stats-sub">${x[subKey]}</span>` : ''}                        </span>                        <span class="stats-val">${x[valKey]}</span>                    </div>`).join('')                : '<p class="sidebar-empty">Sin registros aún</p>';            return `                <div class="stats-card">                    <div class="stats-card-header">${icono} ${titulo}</div>                    ${filas}                </div>`;        };        panel.innerHTML =            renderLista('Anotadores', '⚽', data.goleadores, 'total', 'equipo') +            renderLista('Amarillas', '🟨', data.tarjetas_amarillas, 'tarjetas', null) +            renderLista('Rojas', '🟥', data.tarjetas_rojas, 'tarjetas', null);    } catch {        panel.innerHTML = '<p class="sidebar-empty">Sin estadísticas aún</p>';    }}async function cargarPosiciones() {    const wrap = document.getElementById('tabla-posiciones-wrap');    wrap.innerHTML = '<div class="spinner"></div>';    let data;    try {        data = await sbData.getTablaPosiciones(parseInt(torneoActual));        if (!Array.isArray(data)) throw new Error();    } catch {        wrap.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Error al cargar la tabla</div>';        document.getElementById('lider-card').innerHTML = '';        return;    }    if (!data.length) {        wrap.innerHTML = '<div class="empty"><div class="empty-icon">🏁</div>Todavía no hay partidos finalizados en este torneo</div>';        document.getElementById('lider-card').innerHTML = '';        return;    }    const lider = data[0];    document.getElementById('lider-card').innerHTML = `        <div class="lider-card">            <div class="lider-trophy">🏆</div>            <div class="lider-info">                <div class="lider-label">Líder del torneo</div>                <div class="lider-nombre">${lider.equipo}</div>                <div class="lider-sub">${lider.pj} partidos · ${lider.pg}G ${lider.pe}E ${lider.pp}P</div>            </div>            <div class="lider-pts">                <div class="num">${lider.pts}</div>                <span class="label">puntos</span>            </div>        </div>`;    const medallas = ['🥇','🥈','🥉'];    const posClases = ['pos-1','pos-2','pos-3'];    const filas = data.map((e, i) => {        const dgClass = e.dg > 0 ? 'dg-pos' : e.dg < 0 ? 'dg-neg' : 'dg-neu';        const dgStr   = e.dg > 0 ? '+' + e.dg : e.dg;        const posBadge = i < 3            ? `<span class="pos-badge pos-${i+1}">${medallas[i]}</span>`            : `<span class="pos-badge">${i+1}</span>`;        return `<tr class="${i === 0 ? 'lider-row' : ''}">            <td>${posBadge}</td>            <td><span class="equipo-nombre">${e.equipo}</span></td>            <td>${e.pj}</td>            <td class="pg-col">${e.pg}</td>            <td class="pe-col">${e.pe}</td>            <td class="pp-col">${e.pp}</td>            <td>${e.gf}</td>            <td>${e.gc}</td>            <td class="${dgClass}">${dgStr}</td>            <td class="pts-col">${e.pts}</td>        </tr>`;    }).join('');    const tarjetas = data.map((e, i) => {        const dgStr = e.dg > 0 ? '+' + e.dg : e.dg;        const posLabel = i < 3 ? medallas[i] : i + 1;        const posClass = i < 3 ? posClases[i] : '';        return `        <div class="tabla-card-equipo ${i === 0 ? 'lider' : ''}">            <div class="tabla-card-top">                <div class="tabla-card-pos ${posClass}">${posLabel}</div>                <div class="tabla-card-nombre">${e.equipo}</div>                <div class="tabla-card-pts">${e.pts} <small>pts</small></div>            </div>            <div class="tabla-card-stats">                <span><b>${e.pj}</b>PJ</span>                <span><b style="color:#16a34a">${e.pg}</b>G</span>                <span><b style="color:#b7860b">${e.pe}</b>E</span>                <span><b style="color:#c0392b">${e.pp}</b>P</span>                <span><b>${e.gf}</b>GF</span>                <span><b>${e.gc}</b>GC</span>                <span><b style="color:${e.dg > 0 ? '#16a34a' : e.dg < 0 ? '#c0392b' : '#6b7f6b'}">${dgStr}</b>DG</span>            </div>        </div>`;    }).join('');    wrap.innerHTML = `        <table>            <thead><tr>                <th>#</th><th>Equipo</th><th>PJ</th>                <th>G</th><th>E</th><th>P</th>                <th>GF</th><th>GC</th><th>DG</th>                <th>PTS</th>            </tr></thead>            <tbody>${filas}</tbody>        </table>        <div class="tabla-cards">${tarjetas}</div>`;}async function cargarResultados() {    const lista = document.getElementById('lista-resultados');    lista.innerHTML = '<div class="spinner"></div>';    const data = await sbData.getResultados(parseInt(torneoActual));    if (!data.length) {        lista.innerHTML = '<div class="empty"><div class="empty-icon">⚽</div>Aún no se jugaron partidos en este torneo</div>';        return;    }    lista.innerHTML = data.map(r => {        const enCurso    = r.estado?.toLowerCase().includes('curso');        const badgeClass = enCurso ? 'badge-en-curso' : 'badge-finalizado';        const cardClass  = enCurso ? 'en-curso' : 'finalizado';        const badgeTexto = enCurso ? 'EN VIVO' : 'Finalizado';        return `        <div class="partido-card ${cardClass}" onclick="abrirDetalle(${r.id_partido})">            <div class="partido-equipo">                <span class="equipo-card-nombre">${r.equipo_local}</span>            </div>            <div class="partido-score">                <span class="score-num">${r.marcador_local ?? 0}<span class="score-sep"> - </span>${r.marcador_visitante ?? 0}</span>                <div class="partido-meta">                    <span class="badge-estado ${badgeClass}">${badgeTexto}</span>                    <span class="partido-fecha">${formatFecha(r.fecha)}</span>                </div>            </div>            <div class="partido-equipo visitante">                <span class="equipo-card-nombre">${r.equipo_visitante}</span>            </div>        </div>`;    }).join('');}async function cargarProximos() {    const lista = document.getElementById('lista-proximos');    lista.innerHTML = '<div class="spinner"></div>';    const data = await sbData.getProximos(parseInt(torneoActual));    if (!data.length) {        lista.innerHTML = '<div class="empty"><div class="empty-icon">🗓️</div>No hay partidos programados por el momento</div>';        return;    }    lista.innerHTML = data.map(r => `        <div class="proximo-card" onclick="abrirDetalle(${r.id_partido})">            <div class="partido-equipo">                <span class="equipo-card-nombre">${r.equipo_local}</span>            </div>            <div class="partido-score">                <span class="vs-badge">VS</span>                <span class="proximo-fecha">${formatFecha(r.fecha)}</span>            </div>            <div class="partido-equipo visitante">                <span class="equipo-card-nombre">${r.equipo_visitante}</span>            </div>        </div>`).join('');}async function abrirDetalle(idPartido) {    const overlay   = document.getElementById('modal-overlay');    const contenido = document.getElementById('modal-contenido');    contenido.innerHTML = '<div class="spinner"></div>';    overlay.style.display = 'flex';    document.body.style.overflow = 'hidden';    try {        const d = await sbData.getPartidoDetalle(parseInt(idPartido));        const p          = d.partido;        const enCurso    = p.estado?.toLowerCase().includes('curso');        const finalizado = p.estado?.toLowerCase().includes('finalizado');        const score = (finalizado || enCurso)            ? `${p.marcador_local ?? 0} <span class="modal-score-sep">-</span> ${p.marcador_visitante ?? 0}`            : `<span style="font-size:1rem;color:rgba(255,255,255,.4)">vs</span>`;        const iconoEvento = tipo => {            const t = tipo.toLowerCase();            if (t.includes('gol') && !t.includes('contra')) return '⚽';            if (t.includes('contra')) return '⚽🔴';            if (t.includes('amarilla')) return '🟨';            if (t.includes('roja')) return '🟥';            return '📌';        };        const renderPlantilla = jugadores => jugadores.length            ? jugadores.map(j => `<div class="modal-jugador">👤 ${j.nombre} ${j.apellido}</div>`).join('')            : '<div class="modal-jugador" style="color:var(--text-muted)">Sin jugadores registrados</div>';        const renderEventos = eventos => eventos.length            ? eventos.map(e => `                <div class="modal-evento">                    <span class="modal-evento-icono">${iconoEvento(e.tipo)}</span>                    <span class="modal-evento-min">${e.minuto}'</span>                    <span>${e.nombre} ${e.apellido}</span>                    <span class="modal-evento-tipo">${e.tipo}</span>                </div>`).join('')            : '<div style="color:var(--text-muted);font-size:.85rem;padding:.5rem 0">Sin eventos registrados aún</div>';        contenido.innerHTML = `            <div class="modal-header ${enCurso ? 'en-curso' : ''}">                ${enCurso ? '<div class="modal-live-badge"><span></span>EN VIVO</div>' : ''}                <div class="modal-equipos">                    <span class="modal-equipo-nombre">${p.equipo_local}</span>                    <div class="modal-score">${score}</div>                    <span class="modal-equipo-nombre">${p.equipo_visitante}</span>                </div>                <div class="modal-meta">${formatFecha(p.fecha)} · Árbitro: ${p.arbitro}</div>            </div>            <div class="modal-body">                <div class="modal-col">                    <div class="modal-col-title">🟦 ${p.equipo_local}</div>                    ${renderPlantilla(d.plantilla_local)}                </div>                <div class="modal-col">                    <div class="modal-col-title">🟥 ${p.equipo_visitante}</div>                    ${renderPlantilla(d.plantilla_visitante)}                </div>            </div>            ${(finalizado || enCurso) ? `            <div class="modal-eventos-section">                <div class="modal-col-title" style="margin-bottom:.75rem">📋 Eventos del partido</div>                ${renderEventos(d.eventos)}            </div>` : ''}`;    } catch {        contenido.innerHTML = '<div class="empty">No se pudo cargar el detalle del partido</div>';    }}document.getElementById('modal-close').addEventListener('click', cerrarModal);document.getElementById('modal-overlay').addEventListener('click', e => {    if (e.target === document.getElementById('modal-overlay')) cerrarModal();});document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });function cerrarModal() {    document.getElementById('modal-overlay').style.display = 'none';    document.body.style.overflow = '';}function formatFecha(f) {    if (!f) return '—';    const d = new Date(f);    return isNaN(d) ? f : d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });}cargarDeportes();</script><script src="/scoreEd/assets/js/tiempo-real.js"></script></body></html>
