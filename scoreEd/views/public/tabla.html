<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <title>Tabla de Posiciones - ScoreED</title></head><body>    <h1>Tabla de Posiciones</h1>    <nav>        <a href="resultados.html">Resultados</a> |        <a href="tabla.html">Tabla de posiciones</a>    </nav>    <hr>    <label>Seleccionar torneo:        <select id="id_torneo"></select>    </label>    <button onclick="cargarTabla()">Ver tabla</button>    <table border="1">        <thead>            <tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr>        </thead>        <tbody id="tabla-posiciones"></tbody>    </table>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script src="/scoreEd/assets/js/supabase.js"></script>    <script src="/scoreEd/assets/js/supabase-data.js"></script>    <script>        async function cargarTorneos() {            const torneos = await sbData.getTorneos();            document.getElementById('id_torneo').innerHTML = torneos.map(t => `<option value="${t.id_torneo}">${t.nombre}</option>`).join('');            if (torneos.length) cargarTabla();        }        async function cargarTabla() {            const id = document.getElementById('id_torneo').value;            if (!id) return;            const tabla = await sbData.getTablaPosiciones(parseInt(id));            document.getElementById('tabla-posiciones').innerHTML = tabla.length                ? tabla.map((e, i) => `                    <tr>                        <td>${i + 1}</td>                        <td>${e.equipo}</td>                        <td>${e.pj}</td>                        <td>${e.pg}</td>                        <td>${e.pe}</td>                        <td>${e.pp}</td>                        <td>${e.gf}</td>                        <td>${e.gc}</td>                        <td>${e.dg}</td>                        <td><strong>${e.pts}</strong></td>                    </tr>`).join('')                : '<tr><td colspan="10">No hay partidos finalizados en este torneo</td></tr>';        }        cargarTorneos();    </script></body></html>
