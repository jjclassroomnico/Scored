<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <title>Resultados - ScoreED</title></head><body>    <h1>Resultados</h1>    <nav>        <a href="resultados.html">Resultados</a> |        <a href="tabla.html">Tabla de posiciones</a>    </nav>    <hr>    <label>Filtrar por torneo:        <select id="id_torneo">            <option value="">Todos</option>        </select>    </label>    <button onclick="cargarResultados()">Actualizar</button>    <table border="1">        <thead><tr><th>Fecha</th><th>Local</th><th>Resultado</th><th>Visitante</th><th>Estado</th></tr></thead>        <tbody id="tabla-resultados"></tbody>    </table>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script src="/scoreEd/assets/js/supabase.js"></script>    <script src="/scoreEd/assets/js/supabase-data.js"></script>    <script>        async function cargarTorneos() {            const torneos = await sbData.getTorneos();            const sel = document.getElementById('id_torneo');            torneos.forEach(t => {                const opt = document.createElement('option');                opt.value = t.id_torneo;                opt.textContent = t.nombre;                sel.appendChild(opt);            });        }        async function cargarResultados() {            const id = document.getElementById('id_torneo').value;            const resultados = id                ? await sbData.getResultados(parseInt(id))                : await sbData.getResultados();            document.getElementById('tabla-resultados').innerHTML = resultados.length                ? resultados.map(r => `                    <tr>                        <td>${r.fecha}</td>                        <td>${r.equipo_local}</td>                        <td>${r.marcador_local ?? '-'} - ${r.marcador_visitante ?? '-'}</td>                        <td>${r.equipo_visitante}</td>                        <td>${r.estado}</td>                    </tr>`).join('')                : '<tr><td colspan="5">No hay resultados</td></tr>';        }        cargarTorneos();        cargarResultados();    </script></body></html>
