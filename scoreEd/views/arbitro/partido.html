<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <title>Gestionar Partido - ScoreED</title></head><body>    <h1>Partido en curso</h1>    <a href="panel.html">← Volver al panel</a>    <hr>    <div id="info-partido"></div>    <h2>Registrar Evento</h2>    <form id="form-evento">        <label>Jugador: <select id="id_participante"></select></label><br>        <label>Tipo de evento: <select id="id_tipo_evento"></select></label><br>        <label>Minuto: <input type="number" id="minuto" min="1" max="120" required></label><br>        <label>Comentario: <input type="text" id="comentarios"></label><br>        <input type="hidden" id="equipo_rol">        <button type="submit">Registrar</button>    </form>    <p id="mensaje"></p>    <h2>Eventos del partido</h2>    <table border="1">        <thead><tr><th>Minuto</th><th>Jugador</th><th>Tipo</th><th>Comentario</th><th>Acciones</th></tr></thead>        <tbody id="tabla-eventos"></tbody>    </table>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script src="/scoreEd/assets/js/supabase.js?v=12"></script>    <script src="/scoreEd/assets/js/supabase-data.js?v=12"></script>    <script>        const params = new URLSearchParams(window.location.search);        const idPartido = params.get('id');        if (!idPartido) window.location.href = 'panel.html';        sbRequireAuth('arbitro');        async function cargarInfoPartido() {            const detalle = await sbData.getPartidoDetalle(parseInt(idPartido));            const p = detalle.partido;            if (!p) { document.getElementById('info-partido').textContent = 'Partido no encontrado'; return; }            document.getElementById('info-partido').innerHTML = `                <p><strong>${p.equipo_local}</strong> vs <strong>${p.equipo_visitante}</strong></p>                <p>Torneo: ${p.torneo} | Fecha: ${p.fecha} | Estado: ${p.estado}</p>                <p>Marcador: ${p.marcador_local ?? 0} - ${p.marcador_visitante ?? 0}</p>            `;            const jugLocal = detalle.plantilla_local || [];            const jugVisit = detalle.plantilla_visitante || [];            document.getElementById('id_participante').innerHTML = [                ...jugLocal.map(j => `<option value="${j.id_participante}" data-rol="local">${j.nombre} ${j.apellido} (${p.equipo_local})</option>`),                ...jugVisit.map(j => `<option value="${j.id_participante}" data-rol="visitante">${j.nombre} ${j.apellido} (${p.equipo_visitante})</option>`)            ].join('');            const tipos = await sbData.getTiposEvento(p.id_torneo || p.id_deporte);            document.getElementById('id_tipo_evento').innerHTML = tipos.map(t => `<option value="${t.id_tipo_evento}">${t.nombre}</option>`).join('');            document.getElementById('tabla-eventos').innerHTML = (detalle.eventos || []).map(e => `                <tr>                    <td>${e.minuto}'</td>                    <td>${e.nombre} ${e.apellido}</td>                    <td>${e.tipo}</td>                    <td>${e.comentarios ?? '-'}</td>                    <td><button onclick="eliminarEvento(${e.id_evento})">Eliminar</button></td>                </tr>`).join('');        }        document.getElementById('form-evento').addEventListener('submit', async (e) => {            e.preventDefault();            const sel = document.getElementById('id_participante');            const rol = sel.options[sel.selectedIndex].dataset.rol;            const body = {                id_partido: parseInt(idPartido),                id_participante: parseInt(sel.value),                id_tipo_evento: parseInt(document.getElementById('id_tipo_evento').value),                minuto: parseInt(document.getElementById('minuto').value),                comentarios: document.getElementById('comentarios').value,                equipo_rol: rol            };            try {                await sbData.createEvento(body);                document.getElementById('mensaje').textContent = 'Evento registrado';                document.getElementById('form-evento').reset();                cargarInfoPartido();            } catch (err) {                document.getElementById('mensaje').textContent = err.message;            }        });        async function eliminarEvento(id) {            if (!confirm('¿Eliminar evento?')) return;            try {                await sbData.deleteEvento(id);                document.getElementById('mensaje').textContent = 'Evento eliminado';                cargarInfoPartido();            } catch (err) {                document.getElementById('mensaje').textContent = err.message;            }        }        cargarInfoPartido();    </script></body></html>
