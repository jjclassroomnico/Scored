<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>ScoreEd — Árbitro</title>    <link rel="stylesheet" href="/scoreEd/assets/css/login.css">    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script src="/scoreEd/assets/js/supabase.js?v=12"></script></head><body><a class="logo" href="/scoreEd/">    <span class="logo-icon">🏆</span>    <div class="logo-text">        <span class="logo-name">Score<span>Ed</span></span>        <span class="logo-sub">Sistema de Torneo Escolar</span>    </div></a><div class="card">    <div class="card-body">        <div class="card-title">Iniciar Sesión</div>        <div class="card-sub">Panel del Árbitro</div>        <div class="rol-indicator arbitro">👥 Árbitro</div>        <form id="form-login">            <div class="form-group">                <label for="email">Email</label>                <input type="email" id="email" name="email" class="form-control arbitro" placeholder="arbitro@mail.com" autocomplete="email" required>            </div>            <div class="form-group">                <label for="password">Contraseña</label>                <input type="password" id="password" name="password" class="form-control arbitro" placeholder="••••••••" autocomplete="current-password" required>            </div>            <button type="submit" class="btn-submit arbitro">Iniciar Sesión</button>            <div class="msg-error" id="msg-error"></div>        </form>        <div class="link-otro">¿Sos administrador? <a href="/scoreEd/views/admin/login.html" class="admin">Ingresá acá</a></div>    </div>    <div class="card-footer">ScoreEd v1.0 — Sistema de Gestión de Torneo Escolar</div></div><script>(async function() {    const msgEl = document.getElementById('msg-error')    const s = await sbSession()    if (s) {        if (s.profile.rol === 'arbitro') {            window.location.href = '/scoreEd/views/arbitro/panel.html'            return        }        await sbLogout()    }    window.addEventListener('pageshow', async (e) => {        if (!e.persisted) return        const s2 = await sbSession()        if (s2) await sbLogout()    })    document.getElementById('form-login').addEventListener('submit', async e => {        e.preventDefault()        const email = document.getElementById('email').value        const password = document.getElementById('password').value        msgEl.style.display = 'none'        try {            await sbLogin(email, password, 'arbitro')            window.location.href = '/scoreEd/views/arbitro/panel.html'        } catch (err) {            msgEl.textContent = err.message            msgEl.style.display = 'block'        }    })})()</script></body></html>
